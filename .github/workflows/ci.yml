name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make check
      - run: make test
      - name: Publish badges
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          uv run genbadge coverage -i coverage.xml -o coverage.svg
          uv run interrogate --generate-badge interrogate_badge.svg src/
          # force-push an orphan "badges" branch so protected main stays untouched
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf --cached . >/dev/null
          git add -f coverage.svg interrogate_badge.svg
          git commit -m "chore: update badges"
          git push -f origin badges